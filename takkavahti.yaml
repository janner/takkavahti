substitutions:
  name: takkavahti
  friendly_name: Takkavahti

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32cam
  framework:
    type: arduino

logger:

# BLE tracker & proxy
esp32_ble_tracker:

bluetooth_proxy:
  active: true

# The camera needs PSRAM (the esp32cam module has it)
psram:

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}-fallback"
    password: !secret ap_password

captive_portal:

# Red status LED (GPIO33, active low): shows wifi/error state
status_led:
  pin:
    number: GPIO33
    inverted: true

# Camera (AI-Thinker ESP32-CAM, OV2640)
esp32_camera:
  name: "Takan kamera"
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_pins:
    sda: GPIO26
    scl: GPIO27
  data_pins:
    - GPIO5
    - GPIO18
    - GPIO19
    - GPIO21
    - GPIO36
    - GPIO39
    - GPIO34
    - GPIO35
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  # AI-Thinker: GPIO32 = camera PWDN; without it the sensor stays in power-down
  power_down_pin: GPIO32
  vertical_flip: false
  horizontal_mirror: false
  max_framerate: 5 fps
  idle_framerate: 0.1 fps

# Browser streaming without Home Assistant (port 8080)
esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

# Flash LED (GPIO4) as a switchable white light
output:
  - platform: gpio
    id: flash_led
    pin: GPIO4

light:
  - platform: binary
    name: "Takan valaisin"
    output: flash_led
    restore_mode: ALWAYS_OFF

# Sleep mode (like the adult device): manual idle sleep, wake on flame (GPIO14 HIGH)
deep_sleep:
  id: unitila_sleep
  wakeup_pin:
    number: GPIO14
    allow_other_uses: true
  wakeup_pin_mode: KEEP_AWAKE

button:
  - platform: restart
    name: "Uudelleenkäynnistys"
  - platform: template
    name: "Unitila"
    icon: mdi:power-sleep
    on_press:
      - if:
          condition:
            binary_sensor.is_off: takan_liekki
          then:
            - logger.log: "Unitilaan: heratys liekkisensorista GPIO14"
            - deep_sleep.enter: unitila_sleep
          else:
            - logger.log: "Liekki palaa - ei menna unitilaan"

# KY-026 flame sensor
binary_sensor:
  # DO: comparator digital output (switch threshold set with the KY-026 potentiometer)
  # AO cannot be used: GPIO32 is not on the ESP32-CAM module header and
  # ADC2 pins (GPIO0/2/4/12-15) cannot be read while WiFi is on.
  - platform: gpio
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      allow_other_uses: true
    name: "Takan liekki"
    id: takan_liekki
    filters:
      - delayed_on: 100ms
      - delayed_off: 5s

# Conventional status entities (like the adult device)
  - platform: status
    name: "Yhteys"

text_sensor:
  - platform: version
    name: "Firmware-versio"
  - platform: wifi_info
    ip_address:
      name: "IP-osoite"

# Diagnostics
sensor:
  - platform: wifi_signal
    name: "WiFi-signaali"
    update_interval: 60s
  - platform: uptime
    name: "Käyttöaika"
    update_interval: 60s
