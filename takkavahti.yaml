substitutions:
  name: takkavahti
  friendly_name: Takkavahti

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32cam
  framework:
    type: arduino

logger:

# BLE tracker & proxy
esp32_ble_tracker:

bluetooth_proxy:
  active: true

# Kamera vaatii PSRAMin (esp32cam-modulilla se on)
psram:

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}-fallback"
    password: !secret ap_password

captive_portal:

# Kamera (AI-Thinker ESP32-CAM, OV2640)
esp32_camera:
  name: "Takan kamera"
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_pins:
    sda: GPIO26
    scl: GPIO27
  data_pins:
    - GPIO5
    - GPIO18
    - GPIO19
    - GPIO21
    - GPIO36
    - GPIO39
    - GPIO34
    - GPIO35
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  # AI-Thinker: GPIO32 = kameran PWDN; ilman tätä anturi jää power-downiin
  power_down_pin: GPIO32
  vertical_flip: false
  horizontal_mirror: false
  max_framerate: 5 fps
  idle_framerate: 0.1 fps

# Suoratoisto selaimessa ilman Home Assistantia (portti 8080)
esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

# KY-026 liekkisensori
binary_sensor:
  # DO: komparatorin digitaaliulostulo (kytkimen kynnys KY-026:n potentiometrillä)
  # AO ei voi tulla mukaan: GPIO32 ei ole ESP32-CAM-modulin headerilla ja
  # ADC2-kanavia (GPIO0/2/4/12-15) ei voi lukea WiFin ollessa päällä.
  - platform: gpio
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
    name: "Takan liekki"
    filters:
      - delayed_on: 100ms
      - delayed_off: 5s
